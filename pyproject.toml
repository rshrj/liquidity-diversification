[project]
name = "liqdiv"
version = "0.1.0"
description = "Liquidity diversification across crypto venues (after HSBC FX eRisk, 2020)"
authors = [
    { name = "Rishi Raj", email = "me@rishiraj.ch" }
]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
]

[project.scripts]
liqdiv = "liqdiv.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
